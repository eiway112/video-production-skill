<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>纯BGM产品展示验证</title>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: #0a0f1e; }
  body { font-family: "Noto Sans SC", "Microsoft YaHei", sans-serif; color: #e2e8f0; }
  #root { position: relative; width: 1920px; height: 1080px; background: #0a0f1e; }

  .sc { position: absolute; inset: 0; padding: 48px 90px 170px; opacity: 0; visibility: hidden; overflow: hidden; }
  #scene0 { opacity: 1; visibility: visible; }

  .subtitle-safe { position: absolute; left: 0; right: 0; bottom: 0; height: 140px; z-index: 50;
    background: linear-gradient(180deg, rgba(10,15,30,0) 0%, rgba(10,15,30,0.88) 55%, rgba(10,15,30,0.96) 100%);
    pointer-events: none; }
  #scene-end-fade { position: absolute; inset: 0; background: #05070f; opacity: 0; z-index: 60; pointer-events: none; }

  /* 全程运动背景：提升画面熵（码率门禁） */
  #bg-grid { position: absolute; inset: -240px; z-index: 0;
    background-image: radial-gradient(rgba(148,163,184,0.30) 1.6px, transparent 1.6px);
    background-size: 46px 46px; }
  .bg-blob { position: absolute; width: 900px; height: 900px; border-radius: 50%;
    filter: blur(10px); opacity: 0.5; z-index: 0; }
  #bg-b1 { left: -220px; top: -260px; background: radial-gradient(circle, rgba(6,182,212,0.22) 0%, transparent 62%); }
  #bg-b2 { right: -260px; bottom: -300px; background: radial-gradient(circle, rgba(99,102,241,0.20) 0%, transparent 62%); }

  .accent { color: #06b6d4; }
  .dim { color: #94a3b8; }

  .h2-title { font-size: 52px; font-weight: 800; letter-spacing: 2px; }
  .h2-title .bar { display: inline-block; width: 10px; height: 44px; background: #06b6d4; border-radius: 4px;
    margin-right: 20px; vertical-align: -4px; }
  .h3-desc { font-size: 26px; color: #94a3b8; margin-top: 14px; letter-spacing: 1px; }

  .qc-card { background: rgba(30,41,59,0.55); border: 1px solid rgba(148,163,184,0.18); border-radius: 18px;
    padding: 26px 30px; }
  .qc-card .num { font-size: 54px; font-weight: 800; line-height: 1.1; }
  .qc-card .lab { font-size: 22px; color: #94a3b8; margin-top: 8px; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-width="1920" data-height="1080" data-start="0" data-duration="20.0" data-cover-duration="3">

  <div id="bg-grid"></div>
  <div class="bg-blob" id="bg-b1"></div>
  <div class="bg-blob" id="bg-b2"></div>

  <!-- ================= S0 封面 ================= -->
  <div class="sc" id="scene0" data-scene-id="s0" data-scene-entry="gsap" data-scene-subtitle-safe="true">
    <div style="position:absolute;left:0;right:0;top:360px;text-align:center;">
      <div id="cover-title" style="font-size:88px;font-weight:900;letter-spacing:10px;">纯BGM<span class="accent">产品展示</span></div>
      <div id="cover-sub" style="font-size:30px;color:#94a3b8;margin-top:32px;letter-spacing:8px;">无旁白路径 · 端到端验证载体</div>
    </div>
  </div>

  <!-- ================= S1 产品特性 ================= -->
  <div class="sc" id="scene1" data-scene-id="s1" data-scene-entry="gsap" data-scene-subtitle-safe="true">
    <div id="s1-title">
      <div class="h2-title"><span class="bar"></span>产品核心特性</div>
      <div class="h3-desc">画面自述 · 无旁白解说</div>
    </div>
    <div style="display:flex;gap:40px;margin-top:60px;">
      <div class="qc-card" id="s1-c1" style="width:420px;">
        <div class="num accent">立体声</div>
        <div class="lab">44.1kHz · 双声道</div>
      </div>
      <div class="qc-card" id="s1-c2" style="width:420px;">
        <div class="num accent">256k</div>
        <div class="lab">AAC 音频码率</div>
      </div>
      <div class="qc-card" id="s1-c3" style="width:420px;">
        <div class="num accent">BGM</div>
        <div class="lab">外部音源 · 循环对齐</div>
      </div>
    </div>
  </div>

  <!-- ================= S2 规格总览 ================= -->
  <div class="sc" id="scene2" data-scene-id="s2" data-scene-entry="gsap" data-scene-subtitle-safe="true">
    <div id="s2-title">
      <div class="h2-title"><span class="bar"></span>交付规格总览</div>
      <div class="h3-desc">类型化流水线 · 门禁完整保留</div>
    </div>
    <div style="display:flex;gap:40px;margin-top:60px;">
      <div class="qc-card" id="s2-c1" style="width:560px;">
        <div class="num">1920<span style="font-size:30px;">x1080</span></div>
        <div class="lab">分辨率 <span class="dim">· 25fps</span></div>
      </div>
      <div class="qc-card" id="s2-c2" style="width:560px;">
        <div class="num accent">20<span style="font-size:30px;"> s</span></div>
        <div class="lab">总时长 <span class="dim">· 含 3s 封面</span></div>
      </div>
    </div>
  </div>

  <div class="subtitle-safe"></div>
  <div id="scene-end-fade"></div>
</div>

<script>
/* ===== T-block（单一权威时间源，与 narration.json / config t_block 一致） ===== */
var T = { s0: 0.0, s1: 3.0, s2: 12.0 };
/* ===== S-block：场景索引 ===== */
var S = [
  { scene_id: "s0", start: T.s0, end: T.s1, dur: T.s1 - T.s0, type: "cover" },
  { scene_id: "s1", start: T.s1, end: T.s2, dur: T.s2 - T.s1, type: "content" },
  { scene_id: "s2", start: T.s2, end: 20.0, dur: 20.0 - T.s2, type: "content" }
];

var tl = gsap.timeline({ paused: true });

/* ---------- 全程背景运动（覆盖整条时间轴，线性无缓动） ---------- */
tl.to("#bg-grid", { x: 220, y: 150, ease: "none", duration: S[S.length - 1].end }, 0);
tl.to("#bg-b1", { x: 480, y: 260, ease: "none", duration: S[S.length - 1].end }, 0);
tl.to("#bg-b2", { x: -420, y: -300, ease: "none", duration: S[S.length - 1].end }, 0);

/* ---------- 场景切换（淡出上一屏，显示下一屏） ---------- */
function sceneSwitch(prevSel, nextSel, t) {
  tl.to(prevSel, { opacity: 0, duration: 0.5 }, t - 0.5);
  tl.set(prevSel, { visibility: "hidden" }, t);
  tl.set(nextSel, { visibility: "visible" }, t);
  tl.to(nextSel, { opacity: 1, duration: 0.6 }, t);
}

/* ================= S0 封面 ================= */
tl.from("#cover-title", { opacity: 0, y: 50, duration: 0.9, ease: "power2.out" }, 0.1);
tl.from("#cover-sub", { opacity: 0, y: 30, duration: 0.8, ease: "power2.out" }, 0.5);

/* ================= S1 产品特性 ================= */
sceneSwitch("#scene0", "#scene1", T.s1);
tl.from("#s1-title", { opacity: 0, x: -60, duration: 0.8, ease: "power2.out" }, T.s1 + 0.4);
tl.from("#s1-c1", { opacity: 0, y: 50, duration: 0.7, ease: "power2.out" }, T.s1 + 1.6);
tl.from("#s1-c2", { opacity: 0, y: 50, duration: 0.7, ease: "power2.out" }, T.s1 + 3.2);
tl.from("#s1-c3", { opacity: 0, y: 50, duration: 0.7, ease: "power2.out" }, T.s1 + 4.8);

/* ================= S2 规格总览 ================= */
sceneSwitch("#scene1", "#scene2", T.s2);
tl.from("#s2-title", { opacity: 0, x: -60, duration: 0.8, ease: "power2.out" }, T.s2 + 0.4);
tl.from("#s2-c1", { opacity: 0, y: 50, duration: 0.7, ease: "power2.out" }, T.s2 + 1.8);
tl.from("#s2-c2", { opacity: 0, y: 50, duration: 0.7, ease: "power2.out" }, T.s2 + 3.6);

/* ===== 结尾整体淡出 ===== */
tl.to("#scene-end-fade", { opacity: 1, duration: 1.0 }, S[S.length - 1].end - 1.3);

/* ===== 时长锚点：保证时间轴总长精确 ===== */
tl.set({}, {}, S[S.length - 1].end);

window.__timelines = window.__timelines || {};
window.__timelines.main = tl;
tl.play();
</script>
</body>
</html>
